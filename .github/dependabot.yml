version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: 12
      time: "00:05"
      timezone: Europe/Berlin
    cooldown:
      default: 7
    open-pull-requests-limit: 5
    assignees:
      - TanteJoe
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: 12
      time: "00:05"
      timezone: Europe/Berlin
    cooldown:
      default: 7
    open-pull-requests-limit: 5
    assignees:
      - TanteJoe
